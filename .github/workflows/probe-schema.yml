name: probe-schema
on: [push]
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - name: schema
        env:
          K: ${{ secrets.PARTNER_API_KEY }}
          S: ${{ secrets.PARTNER_API_SECRET }}
        run: |
          cat > p.mjs <<'EOF'
          const K=process.env.K||'', S=process.env.S||'';
          console.log('KEY_PRESENT '+(K?'yes':'NO')+'  SECRET_PRESENT '+(S?'yes':'NO'));
          const path='/api/method/tatva_connect.api.partner.lead_schema';
          const hosts={ prod:'https'+'://'+'one.tatvacare.in', uat:'https'+'://'+'one-uat.tatvacare.in' };
          for(const [name,base] of Object.entries(hosts)){
            try{
              const r=await fetch(base+path,{headers:{'Authorization':'token '+K+':'+S}});
              const t=await r.text();
              console.log(String.fromCharCode(10)+'=== '+name+' STATUS '+r.status+' ===');
              console.log(t.slice(0,350));
            }catch(e){ console.log(String.fromCharCode(10)+'=== '+name+' THREW '+e.message+' ==='); }
          }
          EOF
          node p.mjs | tee -a "$GITHUB_STEP_SUMMARY"
