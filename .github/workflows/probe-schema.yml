name: probe-schema
on: [push]
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - name: schema
        env:
          K: ${{ secrets.PARTNER_API_KEY }}
          S: ${{ secrets.PARTNER_API_SECRET }}
        run: |
          cat > p.mjs <<'EOF'
          const base='https'+'://'+'one.tatvacare.in';
          const url=base+'/api/method/tatva_connect.api.partner.lead_schema';
          const r=await fetch(url,{headers:{'Authorization':'token '+process.env.K+':'+process.env.S}});
          const txt=await r.text();
          let j; try{ j=JSON.parse(txt);}catch(e){ console.log('STATUS',r.status,'NONJSON',txt.slice(0,400)); process.exit(0);}
          const d=j.data||j||{};
          const fields=(d.fields||[]).map(f=>f.fieldname+'  ['+(f.behavior||f.reqd||'')+']'+(f.allowed_values?('  vals='+JSON.stringify(f.allowed_values).slice(0,160)):''));
          console.log('STATUS',r.status);
          console.log('FIELDS ('+fields.length+'):');
          console.log(fields.join(String.fromCharCode(10)));
          const ch=d.children||d.sections||{};
          console.log(String.fromCharCode(10)+'SECTIONS: '+Object.keys(ch).join(', '));
          for(const k of Object.keys(ch)){ console.log('['+k+'] '+JSON.stringify(ch[k]).slice(0,500)); }
          console.log(String.fromCharCode(10)+'BULK '+JSON.stringify(d.bulk||{}));
          console.log(String.fromCharCode(10)+'PROGRAMS '+JSON.stringify(d.programs||d.allowed_programs||'n/a').slice(0,300));
          EOF
          node p.mjs | tee -a "$GITHUB_STEP_SUMMARY"
