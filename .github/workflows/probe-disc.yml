name: probe-disc
on: [push]
jobs:
  dsc:
    runs-on: ubuntu-latest
    steps:
      - name: disc
        env:
          K: ${{ secrets.PARTNER_API_KEY }}
          S: ${{ secrets.PARTNER_API_SECRET }}
        run: |
          cat > p.mjs <<'PEOF'
          
          const K=process.env.K||'', S=process.env.S||''; const auth='token '+K+':'+S;
          const B='https'+'://'+'one.tatvacare.in'+'/api/method/tatva_connect.api.partner.';
          async function page(off){const r=await fetch(B+'lead_get_bulk',{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify({created_after:'2026-09-25 00:00:00',created_before:'2026-10-13 00:00:00',limit:200,offset:off})});if(!r.ok){console.log('HTTP',r.status);return [];}const j=await r.json();return j.results||[];}
          let raw=[]; for(let off=0;off<40000;off+=200){const p=await page(off);raw=raw.concat(p);if(p.length<200)break;}
          let leads=raw.map(x=>x.lead||x.data||x).filter(l=>((l.source||'')+'').trim()==='FB Lead Ads');
          const ED=s=>((s==null?'':''+s)).replace(/–/g,'-');
          const acqOf=l=>Array.isArray(l.custom_acquisition_profile)?l.custom_acquisition_profile[0]:l.custom_acquisition_profile;
          const formId=l=>{const m=((l.custom_source_origin||'')+'').match(/(\d{6,})/);return m?m[1]:'';};
          const FORM={'2171554570323502':'GLP','2090088925195100':'Diabetes','2128093497914327':'Diabetes','2139550823270457':'Obesity','1633229261518119':'Obesity'};
          function getProg(l){const a=acqOf(l)||{};let d=ED(a.utm_disease).toLowerCase().trim();
            if(d){if(d.includes('pre'))return null;if(d.includes('glp'))return'GLP';if(d.includes('diab'))return'Diabetes';if(d.includes('obes')||d.includes('weight'))return'Obesity';return null;}
            const c=ED(a.utm_campaign).toLowerCase();if(c){if(c.includes('glp'))return'GLP';if(c.includes('diab'))return'Diabetes';if(c.includes('obes'))return'Obesity';}
            return FORM[formId(l)]||null;}
          const sv=(sa,sub)=>{const q=(sa||[]).find(x=>((x.question||'')+'').toLowerCase().includes(sub));return q?ED(q.value):'';};
          const inW=(l,s,e)=>{const co=(''+(l.creation||'')).slice(0,10);return co>=s&&co<=e;};
          function tally(arr){const m={};for(const x of arr){const k=x===''?'(blank)':x;m[k]=(m[k]||0)+1;}return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,25);}
          const DIA=leads.filter(l=>getProg(l)==='Diabetes'&&inW(l,'2026-10-01','2026-10-11'));
          console.log('DIABETES Oct1-11 leads:',DIA.length);
          console.log(' HbA1c values:'); for(const [k,n] of tally(DIA.map(l=>sv(l.custom_screening_answers||[],'hba1c').toLowerCase()))) console.log('   '+n+'  ['+k+']');
          console.log(' Age values:'); for(const [k,n] of tally(DIA.map(l=>sv(l.custom_screening_answers||[],'age').toLowerCase()))) console.log('   '+n+'  ['+k+']');
          console.log(' Payment values:'); for(const [k,n] of tally(DIA.map(l=>(sv(l.custom_screening_answers||[],'invest')||sv(l.custom_screening_answers||[],'paid_program')).toLowerCase()))) console.log('   '+n+'  ['+k+']');
          const OB=leads.filter(l=>getProg(l)==='Obesity'&&inW(l,'2026-10-01','2026-10-11'));
          console.log('\nOBESITY Oct1-11 leads:',OB.length);
          console.log(' custom_bmi values:'); for(const [k,n] of tally(OB.map(l=>ED(l.custom_bmi).toLowerCase()))) console.log('   '+n+'  ['+k+']');
          console.log(' screening bmi values:'); for(const [k,n] of tally(OB.map(l=>sv(l.custom_screening_answers||[],'bmi').toLowerCase()))) console.log('   '+n+'  ['+k+']');
          console.log(' Age values:'); for(const [k,n] of tally(OB.map(l=>sv(l.custom_screening_answers||[],'age').toLowerCase()))) console.log('   '+n+'  ['+k+']');
          console.log(' Payment values:'); for(const [k,n] of tally(OB.map(l=>(sv(l.custom_screening_answers||[],'invest')||sv(l.custom_screening_answers||[],'paid_program')).toLowerCase()))) console.log('   '+n+'  ['+k+']');
          
          PEOF
          node p.mjs | tee -a "$GITHUB_STEP_SUMMARY"
