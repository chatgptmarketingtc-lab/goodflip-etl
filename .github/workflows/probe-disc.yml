name: probe-disc
on: [push]
jobs:
  dsc:
    runs-on: ubuntu-latest
    steps:
      - name: disc
        env:
          K: ${{ secrets.PARTNER_API_KEY }}
          S: ${{ secrets.PARTNER_API_SECRET }}
        run: |
          cat > p.mjs <<'EOF'
          const K=process.env.K||'', S=process.env.S||''; const auth='token '+K+':'+S;
          const B='https'+'://'+'one.tatvacare.in'+'/api/method/tatva_connect.api.partner.';
          async function page(off){const r=await fetch(B+'lead_get_bulk',{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify({created_after:'2026-10-11 00:00:00',created_before:'2026-10-12 00:00:00',limit:200,offset:off})});if(!r.ok){console.log('HTTP',r.status,(await r.text()).slice(0,200));return [];}const j=await r.json();return j.results||[];}
          let raw=[]; for(let off=0;off<6000;off+=200){const p=await page(off);raw=raw.concat(p);if(p.length<200)break;}
          const leads=raw.map(x=>x.lead||x.data||x);
          const src={};
          for(const l of leads){const s=((l.source==null?'(blank)':l.source)+'').trim()||'(blank)';src[s]=(src[s]||0)+1;}
          console.log('TOTAL raw leads Oct11 (unfiltered):', leads.length);
          const ent=Object.entries(src).sort((a,b)=>b[1]-a[1]);
          for(const [k,n] of ent) console.log('  SRC ['+k+'] = '+n);
          EOF
          node p.mjs | tee -a "$GITHUB_STEP_SUMMARY"
