name: probe-disc
on: [push]
jobs:
  dsc:
    runs-on: ubuntu-latest
    steps:
      - name: disc
        env:
          REVURL: ${{ secrets.PROGRAM_REVENUE_XLSX_URL }}
        run: |
          npm i xlsx --no-audit --no-fund >/dev/null 2>&1
          cat > p.mjs <<'EOF'
          const REV=process.env.REVURL||'';
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';
          async function fetchSp(url){ const jar={};
            async function hop(start){ let current=start, resp=null;
              for(let i=0;i<14;i++){ const ck=Object.entries(jar).map(([k,val])=>k+'='+val).join('; ');
                resp=await fetch(current,{redirect:'manual',cache:'no-store',headers:Object.assign({'User-Agent':UA,'Accept':'text/html,*/*;q=0.8'}, ck?{'Cookie':ck}:{})});
                const sc=(typeof resp.headers.getSetCookie==='function')?resp.headers.getSetCookie():[];
                for(const cc of sc){const seg=cc.split(';')[0];const jx=seg.indexOf('=');if(jx>0)jar[seg.slice(0,jx).trim()]=seg.slice(jx+1).trim();}
                if(resp.status>=300&&resp.status<400){const loc=resp.headers.get('location');if(!loc)return resp;current=new URL(loc,current).toString();continue;}
                return resp; } return resp; }
            await hop(url); return await hop(url); }
          const XLSX=await import('xlsx');
          const u=REV + (REV.includes('?')?'&':'?') + 'nocache='+Date.now();
          const r=await fetchSp(u);
          console.log('HTTP', r.status, 'ct', (r.headers.get('content-type')||'').slice(0,40));
          const buf=Buffer.from(await r.arrayBuffer());
          const wb=XLSX.read(buf,{cellDates:false});
          console.log('tabs:', wb.SheetNames.join(' | '));
          let shown=0;
          for(const nm of wb.SheetNames){ if(!(''+nm).toLowerCase().startsWith('gf'))continue;
            const rows=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:null}); if(!rows.length)continue;
            console.log('TAB ['+nm+'] headers:');
            (rows[0]||[]).forEach((h,ix)=>{ if(h!=null&&(''+h).trim()!=='') console.log('   '+ix+': '+h); });
            shown++; if(shown>=2)break; }
          EOF
          node p.mjs | tee -a "$GITHUB_STEP_SUMMARY"
