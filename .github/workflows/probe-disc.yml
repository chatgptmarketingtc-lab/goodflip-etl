name: probe-disc
on: [push]
jobs:
  dsc:
    runs-on: ubuntu-latest
    steps:
      - name: disc
        env:
          K: ${{ secrets.PARTNER_API_KEY }}
          S: ${{ secrets.PARTNER_API_SECRET }}
        run: |
          cat > p.mjs <<'EOF'
          const K=process.env.K||'', S=process.env.S||'';
          const auth='token '+K+':'+S;
          const B='https'+'://'+'one.tatvacare.in'+'/api/method/tatva_connect.api.partner.';
          const body={created_after:'2026-10-01 00:00:00', limit:5, offset:0};
          const r=await fetch(B+'lead_get_bulk',{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify(body)});
          const gb=await r.json();
          console.log('STATUS '+r.status+'  TOPKEYS '+Object.keys(gb).join(','));
          console.log('PAGING '+JSON.stringify(gb.paging||{}));
          const res=gb.results||[];
          console.log('RESULTS '+res.length);
          const leads=res.map(x=>x.lead||x.data||x).filter(x=>x&&typeof x==='object');
          console.log('LEADS '+leads.length);
          for(const L0 of leads.slice(0,2)){
            const Lx=JSON.parse(JSON.stringify(L0));
            for(const k of ['mobile_no','first_name','last_name','full_name','email','custom_patient_id']) if(k in Lx) Lx[k]='X';
            const top={name:Lx.name,creation:Lx.creation,source:Lx.source,src_origin:Lx.custom_source_origin,age:Lx.custom_age_group,bmi:Lx.custom_bmi,city:Lx.custom_city,cond:Lx.custom_condition,substage:Lx.custom_substage,fb:Lx.facebook_lead_id,owner:Lx.lead_owner};
            console.log(''); console.log('LEAD_TOP '+JSON.stringify(top));
            const acq=Lx.custom_acquisition_profile; console.log('ACQ '+JSON.stringify(Array.isArray(acq)?acq[0]:acq).slice(0,400));
            const sa=Lx.custom_screening_answers||[]; console.log('SCREENING ('+sa.length+'):'); for(const q of sa) console.log('   q='+q.question+' | '+String(q.label).slice(0,40)+' => '+String(q.value).slice(0,60));
          }
          EOF
          node p.mjs | tee -a "$GITHUB_STEP_SUMMARY"
