name: probe-disc
on: [push]
jobs:
  dsc:
    runs-on: ubuntu-latest
    steps:
      - name: disc
        env:
          K: ${{ secrets.PARTNER_API_KEY }}
          S: ${{ secrets.PARTNER_API_SECRET }}
        run: |
          cat > p.mjs <<'PEOF'
          const K=process.env.K||'', S=process.env.S||''; const auth='token '+K+':'+S;
          const B='https'+'://'+'one.tatvacare.in'+'/api/method/tatva_connect.api.partner.';
          async function page(off){const r=await fetch(B+'lead_get_bulk',{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify({created_after:'2026-10-05 00:00:00',created_before:'2026-10-14 00:00:00',limit:200,offset:off})});if(!r.ok){console.log('HTTP',r.status);return [];}const j=await r.json();return j.results||[];}
          let raw=[]; for(let off=0;off<60000;off+=200){const p=await page(off);raw=raw.concat(p);if(p.length<200)break;}
          const FB=raw.map(x=>x.lead||x.data||x).filter(l=>((l.source||'')+'').trim()==='FB Lead Ads');
          const ED=s=>((s==null?'':''+s)).replace(/\u2013/g,'-');
          const formId=l=>{const m=((l.custom_source_origin||'')+'').match(/(\d{6,})/);return m?m[1]:'';};
          const sv=(sa,sub)=>{const q=(sa||[]).find(x=>((x.question||'')+'').toLowerCase().includes(sub));return q?ED(q.value):'';};
          const svAge=sa=>{const q=(sa||[]).find(x=>{const t=((x.question||'')+'').toLowerCase();return t.includes('age')&&!t.includes('average')&&!t.includes('manage')&&!t.includes('hba1c')&&!t.includes('package');});return q?ED(q.value):'';};
          const NEW='2128093497914327';
          const D=FB.filter(l=>formId(l)===NEW && (''+(l.creation||'')).slice(0,10)>='2026-10-08' && (''+(l.creation||'')).slice(0,10)<='2026-10-13');
          console.log('=== New Diabetes form '+NEW+' Oct8-13: '+D.length+' FB leads ===');
          const qset={};
          for(const l of D){for(const a of (l.custom_screening_answers||[])){const q=((a.question||'')+'').trim();const v=((a.value||'')+'').trim();qset[q]=qset[q]||{n:0,filled:0,sample:''};qset[q].n++;if(v){qset[q].filled++;if(!qset[q].sample)qset[q].sample=v;}}}
          console.log('-- Distinct screening questions [filled/total] (sample value) --');
          for(const [q,o] of Object.entries(qset)) console.log('  ['+o.filled+'/'+o.n+']  Q='+JSON.stringify(q)+'  e.g. '+JSON.stringify(o.sample));
          let rAge=0,rHba=0,rPay=0,rCitySA=0,rCityCustom=0;
          for(const l of D){const sa=l.custom_screening_answers||[];if(svAge(sa))rAge++;if(sv(sa,'hba1c'))rHba++;if(sv(sa,'invest')||sv(sa,'paid_program'))rPay++;if(sv(sa,'city'))rCitySA++;if(((l.custom_city||'')+'').trim())rCityCustom++;}
          console.log('-- Scorer resolves (non-blank) of '+D.length+' --');
          console.log('  age(svAge)='+rAge+'  hba1c(sv hba1c)='+rHba+'  payment(sv invest/paid_program)='+rPay+'  city(sv city)='+rCitySA+'  custom_city field='+rCityCustom);
          PEOF
          node p.mjs | tee -a "$GITHUB_STEP_SUMMARY"
