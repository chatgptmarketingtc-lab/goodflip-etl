name: probe-disc
on: [push]
jobs:
  dsc:
    runs-on: ubuntu-latest
    steps:
      - name: disc
        env:
          K: ${{ secrets.PARTNER_API_KEY }}
          S: ${{ secrets.PARTNER_API_SECRET }}
        run: |
          cat > p.mjs <<'EOF'
          const K=process.env.K||'', S=process.env.S||''; const auth='token '+K+':'+S;
          const B='https'+'://'+'one.tatvacare.in'+'/api/method/tatva_connect.api.partner.';
          async function page(off){const r=await fetch(B+'lead_get_bulk',{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify({created_after:'2026-09-20 00:00:00',created_before:'2026-10-12 00:00:00',limit:200,offset:off})});if(!r.ok){console.log('HTTP',r.status);return [];}const j=await r.json();return j.results||[];}
          let raw=[]; for(let off=0;off<6000;off+=200){const p=await page(off);raw=raw.concat(p);if(p.length<200)break;}
          const leads=raw.map(x=>x.lead||x.data||x);
          const acqOf=l=>Array.isArray(l.custom_acquisition_profile)?l.custom_acquisition_profile[0]:l.custom_acquisition_profile;
          const us={}; for(const l of leads){const a=acqOf(l)||{}; const u=((a.utm_source==null?'(none)':a.utm_source)+'').trim()||'(blank)'; us[u]=(us[u]||0)+1;}
          console.log('utm_source distribution:'); for(const [k,n] of Object.entries(us).sort((a,b)=>b[1]-a[1])) console.log('  ['+k+'] = '+n);
          // for source==Goodflip leads, what utm_source?
          const gf={}; let gfN=0; for(const l of leads){ if(((l.source||'')+'').trim().toLowerCase()==='goodflip'){ gfN++; const a=acqOf(l)||{}; const u=((a.utm_source==null?'(none)':a.utm_source)+'').trim()||'(blank)'; gf[u]=(gf[u]||0)+1; } }
          console.log('Goodflip-source leads ('+gfN+') -> their utm_source:'); for(const [k,n] of Object.entries(gf).sort((a,b)=>b[1]-a[1])) console.log('  ['+k+'] = '+n);
          // for blank-source leads -> utm_source
          const bl={}; let blN=0; for(const l of leads){ if(((l.source||'')+'').trim()===''){ blN++; const a=acqOf(l)||{}; const u=((a.utm_source==null?'(none)':a.utm_source)+'').trim()||'(blank)'; bl[u]=(bl[u]||0)+1; } }
          console.log('blank-source leads ('+blN+') -> their utm_source:'); for(const [k,n] of Object.entries(bl).sort((a,b)=>b[1]-a[1])) console.log('  ['+k+'] = '+n);
          EOF
          node p.mjs | tee -a "$GITHUB_STEP_SUMMARY"
