name: probe-diag
on: [push]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: diag
        env:
          K: ${{ secrets.PARTNER_API_KEY }}
          S: ${{ secrets.PARTNER_API_SECRET }}
        run: |
          cat > p.mjs <<'EOF'
          import {createHash} from 'crypto';
          const h=x=>createHash('sha256').update(x,'utf8').digest('hex');
          const K=process.env.K||'', S=process.env.S||'';
          const base='https'+'://'+'one.tatvacare.in';
          const path='/api/method/tatva_connect.api.partner.lead_schema';
          const auth='token '+K+':'+S;
          try{ const ip=await (await fetch('https'+'://'+'api.ipify.org')).text(); console.log('RUNNER_IP '+ip); }catch(e){ console.log('RUNNER_IP_ERR '+e.message); }
          try{ const r=await fetch(base+path,{redirect:'manual',headers:{'Authorization':auth}}); console.log('MANUAL_STATUS '+r.status+'  LOCATION '+(r.headers.get('location')||'-')); console.log('RESP_HDRS server='+r.headers.get('server')+' cf-ray='+r.headers.get('cf-ray')+' x-frappe='+r.headers.get('x-frappe-site-name')); }catch(e){ console.log('MANUAL_THREW '+e.message); }
          try{ const r=await fetch(base+path,{headers:{'Authorization':auth}}); const t=await r.text(); console.log('FOLLOW_STATUS '+r.status+'  FINAL_URL '+r.url); console.log('BODY '+t.slice(0,280)); }catch(e){ console.log('FOLLOW_THREW '+e.message); }
          console.log('KEY_SHA256 '+h(K));
          console.log('SECRET_SHA256 '+h(S));
          EOF
          node p.mjs | tee -a "$GITHUB_STEP_SUMMARY"
