name: Frappe field probe (throwaway)
on:
  push:
    branches: [probe/frappe-fields]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Frappe leads/list fields
        env:
          FRAPPE_SECRET_KEY: ${{ secrets.FRAPPE_SECRET_KEY }}
          FRAPPE_ACCOUNT: ${{ secrets.FRAPPE_ACCOUNT }}
          FRAPPE_BASE_URL: ${{ secrets.FRAPPE_BASE_URL }}
          SCRIPT_B64: 
        run: printf '%s' "$SCRIPT_B64" | base64 -d > probe.mjs && node probe.mjs
