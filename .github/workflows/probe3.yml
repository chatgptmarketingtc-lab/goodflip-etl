name: probe3
on: [push]
jobs:
  dsc:
    runs-on: ubuntu-latest
    steps:
      - name: spend
        env:
          MT: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          cat > p.mjs <<'PEOF'
          const TOK=process.env.MT||''; const V='v23.0';
          const since='2026-10-01', until='2026-10-21';
          async function pull(id){ let url='https://graph.facebook.com/'+V+'/act_'+id+'/insights?level=campaign&fields=campaign_name,spend&time_range='+encodeURIComponent(JSON.stringify({since,until}))+'&limit=500&access_token='+TOK; const rows=[]; let p=0; while(url&&p<30){ const r=await fetch(url); if(!r.ok){console.log('HTTP',r.status);break;} const j=await r.json(); for(const row of j.data||[])rows.push(row); url=j.paging&&j.paging.next?j.paging.next:null; p++; } return rows; }
          const rows=await pull('1649611303396289');
          console.log('=== ACC 1649611303396289 campaigns (Oct 1-21) ===');
          for(const row of rows.sort((a,b)=>(parseFloat(b.spend)||0)-(parseFloat(a.spend)||0))) console.log('  '+Math.round(parseFloat(row.spend)||0)+'  '+row.campaign_name);
          PEOF
          node p.mjs | tee -a "$GITHUB_STEP_SUMMARY"
