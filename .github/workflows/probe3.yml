name: probe3
on: [push]
jobs:
  dsc:
    runs-on: ubuntu-latest
    steps:
      - name: attr
        env:
          K: ${{ secrets.PARTNER_API_KEY }}
          S: ${{ secrets.PARTNER_API_SECRET }}
        run: |
          cat > p.mjs <<'PEOF'
          const K=process.env.K||'', S=process.env.S||''; const auth='token '+K+':'+S;
          const B='https'+'://'+'one.tatvacare.in'+'/api/method/tatva_connect.api.partner.';
          async function page(off){ const r=await fetch(B+'lead_get_bulk',{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify({created_after:'2026-08-01 00:00:00',created_before:'2026-11-17 00:00:00',limit:200,offset:off})}); if(!r.ok){console.log('HTTP',r.status);return[];} const j=await r.json(); return j.results||[]; }
          let raw=[]; for(let off=0; off<300000; off+=200){ const p=await page(off); raw=raw.concat(p); if(p.length<200)break; }
          const leads=raw.map(x=>x.lead||x.data||x); console.log('pulled',leads.length);
          const MAP={'fb lead ads':'FB Lead Ads','whatsapp marketing':'WhatsApp Marketing','partner api':'Partner API','tata 1mg':'TATA 1MG','tata1mg':'TATA 1MG','affiliate':'Affiliate','instagram':'Instagram','webpage lead':'Webpage Lead','contact form 7':'Webpage Lead','self sourced':'Self Sourced','inbound phone call':'Inbound Phone Call','outbound phone call':'Outbound Phone Call','doc led gtm':'Doc Led GTM','customer referral':'Customer Referral','existing customer referral':'Customer Referral'};
          function fsrc(s){ const t=(s==null?'':String(s)).trim(); if(!t)return '(no source)'; return MAP[t.toLowerCase()]||t; }
          function fob(origin){ const t=(origin==null?'':String(origin)).trim(); const o=t.toLowerCase(); if(!t)return null; if(o.startsWith('ig |')||o.startsWith('ig|')||o.includes('instagram'))return 'Instagram'; if(o.startsWith('fb |')||o.startsWith('fb|')||o.startsWith('facebook form')||o.includes('facebook'))return 'FB Lead Ads'; if(o.includes('affiliate'))return 'Affiliate'; if(o.includes('tata1mg')||o.includes('tata 1mg'))return 'TATA 1MG'; if(o.includes('whatsapp'))return 'WhatsApp Marketing'; if(o.includes('niva bupa')||o.includes('visitstar')||o.includes('star insurance')||o.includes('insurance'))return t; if(o.includes('glp')&&o.includes('landing'))return 'GLP Landing Page'; if(o.includes('webpage')||o.includes('landing page')||o.includes('link_in_bio'))return 'Webpage Lead'; return null; }
          const SRC_OK=new Set(['fb lead ads','facebook','whatsapp marketing','whatsapp_reactivation','webpage lead','tata 1mg','tata1mg','glp landing page','instagram dm','instagram']);
          const CM={'tata1mg':'TATA 1MG','whatsapp marketing':'WhatsApp Marketing','whatsapp_reactivation':'Whatsapp_Reactivation','fb lead ads':'FB Lead Ads','facebook':'FB Lead Ads','glp landing page':'GLP Landing Page','instagram dm':'Instagram DM','instagram':'Instagram','webpage lead':'Webpage Lead'};
          const canon=k=>CM[(''+k).toLowerCase().trim()]||k;
          function curBucket(l){ const _s=((l.source||'')+'').trim().toLowerCase(); if(_s!=='' && !SRC_OK.has(_s))return null; return canon(_s===''?'TATA 1MG':((l.source||'')+'').trim()); }
          function propBucket(l){ const s=((l.source||'')+'').trim(), o=((l.custom_source_origin||'')+'').trim(); const sl=s.toLowerCase(), ol=o.toLowerCase(); if(sl.includes('1mg')||ol.includes('1mg'))return 'TATA 1MG'; if(s && sl!=='partner api' && sl!=='goodflip')return fsrc(s); const ob=fob(o); if(ob)return ob; if(s)return fsrc(s); return '(no source)'; }
          function mon(d){ d=(''+d).slice(0,10); if(d>='2026-08-01'&&d<='2026-08-31')return 'Aug'; if(d>='2026-09-01'&&d<='2026-09-30')return 'Sep'; if(d>='2026-10-01'&&d<='2026-10-31')return 'Oct'; if(d>='2026-11-01'&&d<='2026-11-16')return 'Nov'; return null; }
          const MS=['Aug','Sep','Oct','Nov']; const myDef={},h1={},h2={},bb={},tot={}; MS.forEach(m=>{myDef[m]=0;h1[m]=0;h2[m]=0;bb[m]=0;tot[m]=0;});
          const before={},after={}; MS.forEach(m=>{before[m]={};after[m]={};});
          const bbOwner={},bbProg={},bbLsq={}; const samp=[];
          for(const l of leads){ const m=mon(l.creation); if(!m)continue; tot[m]++; const s=((l.source||'')+'').trim(), o=((l.custom_source_origin||'')+'').trim(); const sl=s.toLowerCase(), ol=o.toLowerCase();
            if(sl.includes('1mg')||ol.includes('1mg'))myDef[m]++; if(sl==='tata 1mg'||sl==='tata1mg'||s==='')h1[m]++; if(ol.includes('1mg')&&!sl.includes('1mg')&&s!=='')h2[m]++;
            if(s===''&&o===''){ bb[m]++; if(m==='Aug'||m==='Sep'){ const ow=((l.owner||l.lead_owner||'')+'').trim()||'(blank)'; bbOwner[ow]=(bbOwner[ow]||0)+1; const pg=((l.custom_current_program||'')+'').trim()||'(blank)'; bbProg[pg]=(bbProg[pg]||0)+1; const lq=((l.custom_lsq_prospect_id||'')+'').trim(); bbLsq[lq?'has_lsq_pid':'no_lsq_pid']=(bbLsq[lq?'has_lsq_pid':'no_lsq_pid']||0)+1; } }
            const cb=curBucket(l); if(cb!==null)before[m][cb]=(before[m][cb]||0)+1; const ab=propBucket(l); after[m][ab]=(after[m][ab]||0)+1; if(samp.length<6)samp.push(''+l.creation);
          }
          console.log('=== GROUND TRUTH (one.tatvacare.in) ==='); console.log('month|total|myDefTata|H1 partnerTata|H2 originOnly1mg|blank+blank');
          for(const m of MS)console.log('  '+m+'|'+tot[m]+'|'+myDef[m]+'|'+h1[m]+'|'+h2[m]+'|'+bb[m]);
          console.log('creation samples:',JSON.stringify(samp));
          console.log('=== H6 blank+blank Aug+Sep ==='); console.log('owner:',JSON.stringify(Object.entries(bbOwner).sort((a,b)=>b[1]-a[1]).slice(0,10))); console.log('program:',JSON.stringify(Object.entries(bbProg).sort((a,b)=>b[1]-a[1]).slice(0,10))); console.log('lsq_pid:',JSON.stringify(bbLsq));
          console.log('=== BEFORE vs AFTER source distribution ===');
          for(const m of MS){ console.log('-- '+m+' BEFORE:',JSON.stringify(before[m])); console.log('-- '+m+' AFTER :',JSON.stringify(after[m])); }
          PEOF
          node p.mjs | tee -a "$GITHUB_STEP_SUMMARY"
