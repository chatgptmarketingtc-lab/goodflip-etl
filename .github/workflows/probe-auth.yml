name: probe-auth
on: [push]
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: auth
        env:
          K: ${{ secrets.PARTNER_API_KEY }}
          S: ${{ secrets.PARTNER_API_SECRET }}
        run: |
          cat > p.mjs <<'EOF'
          const K=process.env.K||'', S=process.env.S||'';
          console.log('KEY_HAD_WHITESPACE '+(K!==K.trim())+'  SECRET_HAD_WHITESPACE '+(S!==S.trim()));
          const path='/api/method/tatva_connect.api.partner.lead_schema';
          const base='https'+'://'+'one.tatvacare.in';
          const variants=[
            ['raw', 'token '+K+':'+S],
            ['trimmed', 'token '+K.trim()+':'+S.trim()]
          ];
          for(const [nm,auth] of variants){
            try{ const r=await fetch(base+path,{headers:{'Authorization':auth}}); const t=await r.text(); console.log(String.fromCharCode(10)+'### '+nm+' STATUS '+r.status); console.log(t.slice(0,900)); }
            catch(e){ console.log(String.fromCharCode(10)+'### '+nm+' THREW '+e.message); }
          }
          EOF
          node p.mjs | tee -a "$GITHUB_STEP_SUMMARY"
