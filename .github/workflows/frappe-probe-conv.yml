name: frappe-probe-conv
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          FRAPPE_SECRET_KEY: ${{ secrets.FRAPPE_SECRET_KEY }}
          FRAPPE_BASE_URL: ${{ secrets.FRAPPE_BASE_URL }}
          FRAPPE_ACCOUNT: GoodFlip
        run: |
          cat > probe.mjs <<'EOF'
          const BASE=(process.env.FRAPPE_BASE_URL||'https://api.mytatva.in').replace(/\/+$/,'');
          const SEC=process.env.FRAPPE_SECRET_KEY||'';
          const ACC=process.env.FRAPPE_ACCOUNT||'GoodFlip';
          const H={'frappe-secret-key':SEC,'isdecrypted':'1','Accept':'application/json'};
          const qs=o=>new URLSearchParams(o).toString();
          async function list(extra){const u=BASE+'/api/v8/frappe-partner/leads/list?'+qs(Object.assign({account:ACC,limit:'20',offset:'0'},extra));const r=await fetch(u,{headers:H});let j=null;try{j=await r.json();}catch(e){}const m=(j&&j.data&&j.data.data)||{};return {status:r.status,total:m.total,leads:m.leads||[]};}
          (async()=>{
            const b=await list({});
            console.log('BASE status',b.status,'total',b.total,'n',b.leads.length);
            if(b.leads[0])console.log('KEYS:',Object.keys(b.leads[0]).sort().join(','));
            const dk=b.leads[0]?Object.keys(b.leads[0]).filter(k=>/date|modif|creat|convert|updat|stage|time|won|close/i.test(k)):[];
            console.log('DATEKEYS:',dk.join(','));
            b.leads.forEach((L,i)=>{dk.forEach(k=>{if(L[k])console.log(' sample',i,k,'=',JSON.stringify(L[k]));});});
            const conv=b.leads.find(L=>/converted/i.test(String(L.custom_substage||'')));
            if(conv)console.log('CONV KEYS:',Object.keys(conv).sort().join(','),'| substage=',JSON.stringify(conv.custom_substage));
            for(const f of [{custom_substage:'Converted'},{substage:'Converted'},{status:'Converted'},{stage:'Converted'},{modified_after:'2026-10-01'},{updated_after:'2026-10-01'}]){
              try{const r=await list(f);console.log('FILTER',JSON.stringify(f),'-> status',r.status,'total',r.total,'n',r.leads.length);}catch(e){console.log('FILTER',JSON.stringify(f),'ERR',e.message);}
            }
          })();
          EOF
          node probe.mjs | tee -a "$GITHUB_STEP_SUMMARY"
